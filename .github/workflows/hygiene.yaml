name: Hygiene

on:
  pull_request: # All
  push:
    branches:
    - main

jobs:
  format-check:
    name: Leaf C++ Formatting
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format-19
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-19
          clang-format-19 --version

      - name: Check C++ Formatting
        run: |
          if find src/vario src/variants -type f \( -name "*.cpp" -o -name "*.h" \) -exec clang-format-19 --dry-run --Werror {} +; then
            echo "All files are properly formatted."
          else
            echo "Some files need formatting. Run 'Format Leaf C++ Files' task to fix them (see src/README.md#formatting)"
            exit 1
          fi
