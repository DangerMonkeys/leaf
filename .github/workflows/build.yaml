name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest
    env:
      PLATFORMIO_CORE_VERSION: "6.1.19"
      PLATFORMIO_BUILD_CACHE_DIR: ${{ github.workspace }}/.pio/build-cache
      PIO_ENV: ${{ matrix.hardware-variant }}_${{ matrix.behavior-variant }}
    strategy:
      matrix:
        hardware-variant:
          - leaf_3_2_2
          - leaf_3_2_3
          - leaf_3_2_5
          - leaf_3_2_6
          - leaf_3_2_7
          - leaf_3_2_8
        behavior-variant:
          - dev
          - release
        exclude:
          - hardware-variant: leaf_3_2_2
            behavior-variant: release
    name: ${{ matrix.hardware-variant }} ${{ matrix.behavior-variant }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-tags: true # Ensures tags are available
          fetch-depth: 0 # Ensures full history is fetched

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/build.yaml

      # All variants use the same pinned platform and toolchain. Share this
      # large cache instead of storing a copy for every matrix entry.
      - name: Cache PlatformIO toolchain and downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/platforms
            ~/.platformio/packages
          key: ${{ runner.os }}-${{ runner.arch }}-pio-tools-v1-${{ env.PLATFORMIO_CORE_VERSION }}-${{ hashFiles('platformio.ini', 'src/variants/**/platformio.ini') }}

      - name: Cache PlatformIO project libraries
        uses: actions/cache@v4
        with:
          path: .pio/libdeps/${{ env.PIO_ENV }}
          key: ${{ runner.os }}-${{ runner.arch }}-pio-libs-v1-${{ env.PLATFORMIO_CORE_VERSION }}-${{ env.PIO_ENV }}-${{ hashFiles('platformio.ini', 'src/variants/**/platformio.ini') }}

      # GitHub caches are immutable. Save a new snapshot for each commit and
      # restore the latest compatible snapshot so unchanged objects can be reused.
      # Keep variants separate because their compiler flags and signatures differ.
      - name: Cache PlatformIO compiled files
        uses: actions/cache@v4
        with:
          path: ${{ env.PLATFORMIO_BUILD_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-pio-build-v1-${{ env.PLATFORMIO_CORE_VERSION }}-${{ env.PIO_ENV }}-${{ hashFiles('platformio.ini', 'src/variants/**/platformio.ini', 'src/scripts/*.py') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pio-build-v1-${{ env.PLATFORMIO_CORE_VERSION }}-${{ env.PIO_ENV }}-${{ hashFiles('platformio.ini', 'src/variants/**/platformio.ini', 'src/scripts/*.py') }}-

      - name: Install PlatformIO Core
        run: pip install platformio==${{ env.PLATFORMIO_CORE_VERSION }}

      - name: Build PlatformIO Project
        run: pio run --environment ${{ env.PIO_ENV }}

      # Restoring firmware.bin from the build cache can skip the post-build
      # rename action. Always prepare the expected release filename explicitly.
      - name: Prepare release firmware artifact
        if: matrix.behavior-variant == 'release'
        run: Copy-Item ".pio/build/${{ env.PIO_ENV }}/firmware.bin" ".pio/build/${{ env.PIO_ENV }}/firmware-${{ matrix.hardware-variant }}.bin"

      - name: Upload firmware artifacts
        if: matrix.behavior-variant == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.hardware-variant }}
          path: |
            .pio/build/${{ matrix.hardware-variant }}_${{ matrix.behavior-variant }}/firmware-*.bin

      - name: Upload latest_firmware.json artifact
        if: matrix.behavior-variant == 'release' && matrix.hardware-variant == 'leaf_3_2_5' # Arbitrary single job from the matrix (any job will work)
        uses: actions/upload-artifact@v4
        with:
          name: versions
          path: |
            .pio/build/${{ matrix.hardware-variant }}_${{ matrix.behavior-variant }}/latest_versions.json
            .pio/build/${{ matrix.hardware-variant }}_${{ matrix.behavior-variant }}/leaf.version

  update_release:
    name: Update release with build artifacts
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' && github.event.action == 'created'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files (debugging)
        run: ls -R artifacts

      - name: Flatten artifacts directory
        run: |
          shopt -s globstar
          mkdir -p artifacts
          find artifacts/* -type f -exec mv {} artifacts/ \;
          find artifacts/* -type d -empty -delete

      - name: List artifacts files (debugging)
        run: ls -R artifacts

      - name: Copy appropriate hardware firmware to firmware.bin
        # Backwards compatibility: Release 0.0.9 and earlier expect a file named "firmware.bin"
        run: cp artifacts/firmware-leaf_3_2_3.bin artifacts/firmware.bin

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: artifacts/**/*
