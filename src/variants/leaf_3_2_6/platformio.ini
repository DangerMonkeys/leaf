[env:leaf_3_2_6_release]
extends = env:_release
build_flags =
    ${env:_release.build_flags}
    -Isrc/variants/leaf_3_2_6

# Explicit developer-only build: one-shot shutdown stalls selected from Developer.
[env:leaf_3_2_6_shutdown]
extends = env:leaf_3_2_6_release
build_flags =
    ${env:leaf_3_2_6_release.build_flags}
    -D LEAF_SHUTDOWN_FAULT_INJECTION=1
