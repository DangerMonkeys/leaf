[env:leaf_3_2_5_release]
extends = env:_release
build_flags =
    ${env:_release.build_flags}
    -Isrc/variants/leaf_3_2_5

[env:leaf_3_2_5_bench]
extends = env:leaf_3_2_5_release
build_flags =
    ${env:leaf_3_2_5_release.build_flags}
    -D LEAF_USB_BENCH_CONSOLE=1

[env:leaf_3_2_5_tlsbench]
extends = env:leaf_3_2_5_bench
extra_scripts =
    ${env:_release.extra_scripts}
    pre:src/scripts/prepare_tls_bench.py
