<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaf Display Layout Editor</title>
</head>
<body>
<div id="leaf-display-editor" class="leaf-display-editor">
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #f8fafc;
      color: #111827;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #leaf-display-editor {
      --background: #f8fafc;
      --foreground: #111827;
      --card: #ffffff;
      --card-foreground: #111827;
      --primary: #2563eb;
      --primary-foreground: #ffffff;
      --secondary: #e5e7eb;
      --secondary-foreground: #111827;
      --muted: #e5e7eb;
      --muted-foreground: #4b5563;
      --border: #cbd5e1;
      --input: #cbd5e1;
      --ring: #2563eb;
      --viz-series-1: #0ea5e9;
      --font-size-base: 14px;
      --lde-pixel-on: var(--foreground);
      --lde-pixel-off: var(--background);
      --lde-pixel-grid: color-mix(in srgb, var(--border) 54%, transparent);
      --lde-select: var(--viz-series-1);
      color: var(--foreground);
      display: grid;
      gap: 12px;
      grid-template-columns:
        minmax(230px, 270px)
        minmax(260px, 1fr)
        minmax(220px, 280px)
        minmax(250px, 310px);
      align-items: start;
      width: 100%;
    }
    #leaf-display-editor * { box-sizing: border-box; }
    #leaf-display-editor [hidden] { display: none !important; }
    #leaf-display-editor .btn,
    #leaf-display-editor input,
    #leaf-display-editor select,
    #leaf-display-editor textarea {
      border: 1px solid var(--input);
      border-radius: 6px;
      background: var(--card);
      color: var(--card-foreground);
      font: inherit;
    }
    #leaf-display-editor .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 5px 10px;
      cursor: pointer;
    }
    #leaf-display-editor .btn:hover {
      background: var(--secondary);
      color: var(--secondary-foreground);
    }
    #leaf-display-editor .btn[aria-pressed="true"] {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
    }
    #leaf-display-editor input,
    #leaf-display-editor select {
      min-height: 32px;
      padding: 4px 8px;
    }
    #leaf-display-editor textarea {
      padding: 8px;
    }
    #leaf-display-editor .lde-panel {
      display: grid;
      gap: 10px;
      min-width: 0;
    }
    #leaf-display-editor .lde-section {
      display: grid;
      gap: 8px;
    }
    #leaf-display-editor .lde-section-title {
      font-weight: 500;
      color: var(--foreground);
    }
    #leaf-display-editor .lde-controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    #leaf-display-editor .lde-tools {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
    #leaf-display-editor .lde-tools .btn {
      justify-content: center;
      min-width: 0;
    }
    #leaf-display-editor .lde-field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    #leaf-display-editor .lde-field {
      display: grid;
      gap: 4px;
      min-width: 0;
    }
    #leaf-display-editor .lde-field label,
    #leaf-display-editor .lde-label {
      color: var(--muted-foreground);
      font-size: calc(var(--font-size-base) * .86);
    }
    #leaf-display-editor input,
    #leaf-display-editor select,
    #leaf-display-editor textarea {
      width: 100%;
    }
    #leaf-display-editor textarea {
      min-height: 170px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: calc(var(--font-size-base) * .82);
    }
    #leaf-display-editor .lde-stage-wrap {
      display: grid;
      gap: 8px;
      justify-items: center;
      min-width: 0;
    }
    #leaf-display-editor .lde-stage-shell {
      max-width: 100%;
      overflow: auto;
      padding: 8px;
      border: 1px solid var(--border);
      background:
        linear-gradient(45deg, color-mix(in srgb, var(--muted) 42%, transparent) 25%, transparent 25%),
        linear-gradient(-45deg, color-mix(in srgb, var(--muted) 42%, transparent) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, color-mix(in srgb, var(--muted) 42%, transparent) 75%),
        linear-gradient(-45deg, transparent 75%, color-mix(in srgb, var(--muted) 42%, transparent) 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
    #leaf-display-editor canvas {
      display: block;
      image-rendering: pixelated;
      background: var(--lde-pixel-off);
      border: 1px solid var(--foreground);
      cursor: crosshair;
      touch-action: none;
    }
    #leaf-display-editor .lde-status {
      color: var(--muted-foreground);
      font-size: calc(var(--font-size-base) * .86);
      text-align: center;
      min-height: 1.3em;
    }
    #leaf-display-editor .lde-layer-list {
      display: grid;
      gap: 5px;
      max-height: 280px;
      overflow: auto;
      padding-right: 2px;
    }
    #leaf-display-editor .lde-layer-panel {
      height: calc(100vh - 32px);
      grid-template-rows: auto minmax(0, 1fr);
      position: sticky;
      top: 16px;
    }
    #leaf-display-editor .lde-layer-panel .lde-layer-list {
      max-height: none;
      min-height: 0;
    }
    #leaf-display-editor .lde-layer {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      padding: 5px;
      background: transparent;
      color: var(--foreground);
      text-align: left;
    }
    #leaf-display-editor .lde-layer[aria-selected="true"] {
      border-color: var(--primary);
      background: color-mix(in srgb, var(--primary) 12%, transparent);
    }
    #leaf-display-editor .lde-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      padding: 2px 5px;
      border: 1px solid var(--border);
      color: var(--muted-foreground);
      font-size: calc(var(--font-size-base) * .76);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #leaf-display-editor .lde-layer-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #leaf-display-editor .lde-layer-actions {
      display: inline-flex;
      gap: 3px;
    }
    #leaf-display-editor .lde-visibility {
      width: auto;
    }
    #leaf-display-editor .lde-mini {
      padding-inline: 7px;
    }
    #leaf-display-editor .lde-export-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    #leaf-display-editor .lde-export-tabs .btn[aria-pressed="true"] {
      background: var(--primary);
      color: var(--primary-foreground);
    }
    #leaf-display-editor .lde-text-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
    }
    #leaf-display-editor .lde-check-row {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted-foreground);
      font-size: calc(var(--font-size-base) * .86);
    }
    #leaf-display-editor .lde-check-row input {
      width: auto;
      min-height: 0;
    }
    #leaf-display-editor .lde-sim-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: center;
    }
    #leaf-display-editor .lde-sim-row input[type="range"] {
      grid-column: 1 / -1;
      padding-inline: 0;
    }
    #leaf-display-editor .lde-sim-value {
      color: var(--foreground);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: calc(var(--font-size-base) * .86);
    }
    @media (max-width: 1260px) {
      #leaf-display-editor {
        grid-template-columns: minmax(230px, 270px) minmax(260px, 1fr) minmax(250px, 310px);
      }
      #leaf-display-editor .lde-layer-panel {
        grid-column: 3;
        height: auto;
        max-height: calc(100vh - 32px);
      }
      #leaf-display-editor .lde-layer-panel .lde-layer-list {
        max-height: 520px;
      }
    }
    @media (max-width: 980px) {
      #leaf-display-editor {
        grid-template-columns: 1fr;
      }
      #leaf-display-editor .lde-stage-wrap { order: -1; }
      #leaf-display-editor .lde-layer-panel {
        grid-column: auto;
        max-height: none;
        position: static;
      }
      #leaf-display-editor .lde-layer-panel .lde-layer-list {
        max-height: 360px;
      }
    }
    @media (max-width: 420px) {
      #leaf-display-editor .lde-field-grid,
      #leaf-display-editor .lde-tools {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <div class="lde-panel">
    <div class="lde-section">
      <div class="lde-section-title">Display</div>
      <div class="lde-field">
        <label for="lde-profile">Profile</label>
        <select id="lde-profile" class="form-select">
          <option value="96x192">Current Leaf 96 x 192</option>
          <option value="122x250">Candidate 122 x 250</option>
          <option value="168x384">Candidate 168 x 384</option>
        </select>
      </div>
      <div class="lde-field">
        <label for="lde-zoom">Zoom <span id="lde-zoom-value">4x</span></label>
        <input id="lde-zoom" class="form-range" type="range" min="1" max="8" value="4">
      </div>
      <div class="lde-controls">
        <button type="button" class="btn" id="lde-grid">Grid</button>
        <button type="button" class="btn" id="lde-clear">Clear</button>
      </div>
    </div>

    <div class="lde-section">
      <div class="lde-section-title">Add Primitive</div>
      <div class="lde-tools" id="lde-tools"></div>
    </div>

    <div class="lde-section">
      <div class="lde-section-title">Import Main Page</div>
      <div class="lde-field">
        <label for="lde-import">Template</label>
        <select id="lde-import" class="form-select">
          <option value="">Choose...</option>
          <option value="simple">Simple</option>
          <option value="thermal">Thermal</option>
          <option value="thermalAdv">Thermal advanced</option>
          <option value="navigate">Navigate</option>
          <option value="menu">Main menu</option>
          <option value="debug">Debug</option>
        </select>
      </div>
      <button type="button" class="btn" id="lde-import-btn">Import</button>
    </div>

    <div class="lde-section" id="lde-sim-controls">
      <div class="lde-section-title">Live Values</div>
      <label class="lde-check-row">
        <input id="lde-sim-gps-fix" type="checkbox" checked>
        <span>GPS fix</span>
      </label>
      <div class="lde-field">
        <label for="lde-sim-cursor">Selected field</label>
        <select id="lde-sim-cursor" class="form-select">
          <option value="none">None</option>
          <option value="altitude">Altitude</option>
          <option value="user1">User field 1</option>
          <option value="user2">User field 2</option>
          <option value="timer">Timer</option>
        </select>
      </div>
      <div class="lde-sim-row">
        <label for="lde-sim-climb">Climb rate</label>
        <span class="lde-sim-value" id="lde-sim-climb-value"></span>
        <input id="lde-sim-climb" type="range" min="-1200" max="1200" step="10" value="540">
      </div>
      <div class="lde-sim-row">
        <label for="lde-sim-heading">Heading</label>
        <span class="lde-sim-value" id="lde-sim-heading-value"></span>
        <input id="lde-sim-heading" type="range" min="0" max="359" step="1" value="0">
      </div>
      <div class="lde-sim-row">
        <label for="lde-sim-speed">Speed</label>
        <span class="lde-sim-value" id="lde-sim-speed-value"></span>
        <input id="lde-sim-speed" type="range" min="0" max="80" step="1" value="24">
      </div>
      <div class="lde-sim-row">
        <label for="lde-sim-altitude">Altitude</label>
        <span class="lde-sim-value" id="lde-sim-altitude-value"></span>
        <input id="lde-sim-altitude" type="range" min="-500" max="18000" step="10" value="3250">
      </div>
      <div class="lde-sim-row">
        <label for="lde-sim-above-launch">Above launch</label>
        <span class="lde-sim-value" id="lde-sim-above-launch-value"></span>
        <input id="lde-sim-above-launch" type="range" min="-1000" max="5000" step="10" value="820">
      </div>
      <div class="lde-sim-row">
        <label for="lde-sim-glide">Glide</label>
        <span class="lde-sim-value" id="lde-sim-glide-value"></span>
        <input id="lde-sim-glide" type="range" min="0" max="30" step="0.1" value="8.4">
      </div>
      <div class="lde-sim-row">
        <label for="lde-sim-battery">Battery</label>
        <span class="lde-sim-value" id="lde-sim-battery-value"></span>
        <input id="lde-sim-battery" type="range" min="0" max="100" step="5" value="80">
      </div>
      <div class="lde-sim-row">
        <label for="lde-sim-timer">Timer</label>
        <span class="lde-sim-value" id="lde-sim-timer-value"></span>
        <input id="lde-sim-timer" type="range" min="0" max="180" step="1" value="83">
      </div>
    </div>
  </div>

  <div class="lde-stage-wrap">
    <div class="lde-stage-shell">
      <canvas id="lde-canvas" width="384" height="768" aria-label="Pixel display layout editor"></canvas>
    </div>
    <div class="lde-status" id="lde-status"></div>
  </div>

  <div class="lde-panel lde-layer-panel">
    <div class="lde-section-title">Layers</div>
    <div id="lde-layers" class="lde-layer-list"></div>
  </div>

  <div class="lde-panel">
    <div class="lde-section">
      <div class="lde-section-title">Selected Primitive</div>
      <div id="lde-props-empty" class="text-muted">Click a primitive to edit it. Click empty display space to deselect.</div>
      <div id="lde-props" class="lde-section" hidden>
        <div class="lde-field">
          <label for="lde-name">Name</label>
          <input id="lde-name" class="form-control" type="text">
        </div>
        <div class="lde-field-grid" id="lde-prop-fields"></div>
        <div class="lde-field-grid">
          <div class="lde-field">
            <label for="lde-color">Draw color</label>
            <select id="lde-color" class="form-select">
              <option value="1">1 black/set</option>
              <option value="0">0 white/clear</option>
              <option value="2">2 xor/invert</option>
            </select>
          </div>
          <div class="lde-field">
            <label for="lde-font">Font token</label>
            <select id="lde-font" class="form-select">
              <option value="leaf_5h">leaf_5h</option>
              <option value="leaf_5x8">leaf_5x8</option>
              <option value="leaf_6x10">leaf_6x10</option>
              <option value="leaf_6x12">leaf_6x12</option>
              <option value="leaf_7x10">leaf_7x10</option>
              <option value="leaf_8x14">leaf_8x14</option>
              <option value="leaf_9x16">leaf_9x16</option>
              <option value="leaf_10x17">leaf_10x17</option>
              <option value="leaf_7x13">leaf_7x13</option>
              <option value="leaf_21h">leaf_21h</option>
              <option value="leaf_28h">leaf_28h</option>
              <option value="leaf_labels">leaf_labels</option>
              <option value="leaf_compass">leaf_compass</option>
              <option value="leaf_icons">leaf_icons</option>
              <option value="Leaf_BattIcon_Vertical">Leaf_BattIcon_Vertical</option>
              <option value="wind_logo">wind_logo</option>
            </select>
          </div>
        </div>
        <div class="lde-field" id="lde-text-wrap">
          <label for="lde-text">Text</label>
          <input id="lde-text" class="form-control" type="text">
        </div>
        <div class="lde-controls">
          <button type="button" class="btn lde-mini" id="lde-backward">Back</button>
          <button type="button" class="btn lde-mini" id="lde-forward">Forward</button>
          <button type="button" class="btn lde-mini" id="lde-duplicate">Duplicate</button>
          <button type="button" class="btn lde-mini" id="lde-delete">Delete</button>
        </div>
      </div>
    </div>

    <div class="lde-section">
      <div class="lde-section-title">Export</div>
      <div class="lde-export-tabs">
        <button type="button" class="btn" data-export="cpp" aria-pressed="true">C++</button>
        <button type="button" class="btn" data-export="json" aria-pressed="false">JSON</button>
        <button type="button" class="btn" data-export="xbm" aria-pressed="false">XBM</button>
        <button type="button" class="btn" data-export="png" aria-pressed="false">PNG</button>
      </div>
      <label class="lde-check-row" id="lde-png-border-wrap" hidden>
        <input id="lde-png-border" type="checkbox">
        <span>Include border</span>
      </label>
      <div class="lde-text-row">
        <button type="button" class="btn" id="lde-copy">Copy</button>
        <button type="button" class="btn" id="lde-load-json" hidden>Load JSON</button>
        <button type="button" class="btn" id="lde-refresh-export">Refresh</button>
      </div>
      <textarea id="lde-export" class="form-control" spellcheck="false"></textarea>
    </div>
  </div>

  <script src="leaf-fonts.js?v=2026-07-27-actual-fonts"></script>
  <script>
    (() => {
      const root = document.getElementById('leaf-display-editor');
      const canvas = root.querySelector('#lde-canvas');
      const ctx = canvas.getContext('2d');
      let activeCtx = ctx;
      let forceMonoPalette = false;
      const profileSelect = root.querySelector('#lde-profile');
      const zoomInput = root.querySelector('#lde-zoom');
      const zoomValue = root.querySelector('#lde-zoom-value');
      const statusEl = root.querySelector('#lde-status');
      const toolsEl = root.querySelector('#lde-tools');
      const layersEl = root.querySelector('#lde-layers');
      const propsEl = root.querySelector('#lde-props');
      const propsEmptyEl = root.querySelector('#lde-props-empty');
      const propFieldsEl = root.querySelector('#lde-prop-fields');
      const exportEl = root.querySelector('#lde-export');
      const nameInput = root.querySelector('#lde-name');
      const colorInput = root.querySelector('#lde-color');
      const fontInput = root.querySelector('#lde-font');
      const textInput = root.querySelector('#lde-text');
      const textWrap = root.querySelector('#lde-text-wrap');
      const pngBorderInput = root.querySelector('#lde-png-border');
      const pngBorderWrap = root.querySelector('#lde-png-border-wrap');
      const copyButton = root.querySelector('#lde-copy');
      const loadJsonButton = root.querySelector('#lde-load-json');

      const profileMap = {
        '96x192': { w: 96, h: 192 },
        '122x250': { w: 122, h: 250 },
        '168x384': { w: 168, h: 384 }
      };
      const toolDefs = [
        ['pixel', 'Pixel'],
        ['line', 'Line'],
        ['hline', 'H line'],
        ['vline', 'V line'],
        ['box', 'Rectangle'],
        ['circle', 'Circle'],
        ['triangle', 'Triangle'],
        ['text', 'Text'],
        ['varioBar', 'Vario bar'],
        ['bitmap', 'Bitmap']
      ];
      const leafFonts = window.LEAF_U8G2_FONTS || {};
      const fontFallbacks = {
        leaf_5h: [4, 5], leaf_5x8: [5, 8], leaf_6x10: [6, 10], leaf_6x12: [6, 12],
        leaf_7x10: [7, 10], leaf_7x13: [7, 13], leaf_8x14: [8, 14], leaf_9x16: [9, 16],
        leaf_10x17: [10, 17], leaf_21h: [13, 21], leaf_28h: [17, 28],
        leaf_labels: [6, 8], leaf_compass: [7, 9], leaf_icons: [16, 16],
        Leaf_BattIcon_Vertical: [10, 18], wind_logo: [20, 20]
      };
      const state = {
        display: { w: 96, h: 192 },
        zoom: 4,
        showGrid: true,
        tool: 'box',
        shapes: [],
        selectedId: null,
        drag: null,
        exportMode: 'cpp',
        pngBorder: false,
        activeTemplate: null,
        nextId: 1
      };
      const simInputs = {
        gpsFix: root.querySelector('#lde-sim-gps-fix'),
        cursor: root.querySelector('#lde-sim-cursor'),
        climb: root.querySelector('#lde-sim-climb'),
        heading: root.querySelector('#lde-sim-heading'),
        speed: root.querySelector('#lde-sim-speed'),
        altitude: root.querySelector('#lde-sim-altitude'),
        aboveLaunch: root.querySelector('#lde-sim-above-launch'),
        glide: root.querySelector('#lde-sim-glide'),
        battery: root.querySelector('#lde-sim-battery'),
        timer: root.querySelector('#lde-sim-timer')
      };
      const simValues = {
        climb: root.querySelector('#lde-sim-climb-value'),
        heading: root.querySelector('#lde-sim-heading-value'),
        speed: root.querySelector('#lde-sim-speed-value'),
        altitude: root.querySelector('#lde-sim-altitude-value'),
        aboveLaunch: root.querySelector('#lde-sim-above-launch-value'),
        glide: root.querySelector('#lde-sim-glide-value'),
        battery: root.querySelector('#lde-sim-battery-value'),
        timer: root.querySelector('#lde-sim-timer-value')
      };

      function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, Number.isFinite(n) ? n : lo)); }
      function round(n) { return Math.round(Number(n) || 0); }
      function readSimModel() {
        const timerMinutes = Number(simInputs.timer.value);
        return {
          gpsFix: simInputs.gpsFix.checked,
          cursor: simInputs.cursor.value,
          climbRate: Number(simInputs.climb.value),
          heading: Number(simInputs.heading.value),
          speed: Number(simInputs.speed.value),
          altitude: Number(simInputs.altitude.value),
          aboveLaunch: Number(simInputs.aboveLaunch.value),
          glide: Number(simInputs.glide.value),
          battery: Number(simInputs.battery.value),
          timerText: Math.floor(timerMinutes / 60) + ':' + String(timerMinutes % 60).padStart(2, '0')
        };
      }
      function updateSimLabels() {

          exportEl.value = `#define leaf_layout_width ${state.display.w}\n#define leaf_layout_height ${state.display.h}\nstatic const unsigned char leaf_layout_bits[] PROGMEM = {\n${rows.join(',\n')}\n};`;
          return;
        }
        exportEl.value = `// Leaf display layout ${state.display.w} x ${state.display.h}\nvoid draw_exported_layout() {\n${state.shapes.filter(s => s.visible).map(s => '  ' + u8g2Call(s).replace(/\n/g, '\n  ')).join('\n')}\n}`;
      }
      function addLeafShape(add, shape) {
        const normalized = normalizeShape(shape);
        add(normalized);
        return normalized;
      }
      function addLeafText(add, name, x, y, text, font, color = 1) {
        return addLeafShape(add, { type: 'text', name, x, y, text, font, color });
      }
      function addLeafVarioBar(add, name, barTop, barClimbHeight, barSinkHeight, barWidth, reuseShapes = new Map()) {
        const reused = reuseShapes.get(name);
        if (reused) {
          addLeafShape(add, { ...reused, id: undefined, preserveScale: true });
          return;
        }
        addLeafShape(add, {
          type: 'varioBar',
          name,
          x: 0,
          y: barTop,
          w: barWidth,
          posTick: Math.max(1, Math.round(barClimbHeight / 5)),
          negTick: Math.max(1, Math.round(barSinkHeight / 5))
        });
      }
      function addLeafClimbPointerBox(add, x, y, w, h, triSize) {
        addLeafShape(add, { type: 'box', name: 'climb box', x, y, w, h });
        addLeafShape(add, {
          type: 'triangle',
          name: 'climb pointer',
          x1: x - triSize,
          y1: y + Math.trunc(h / 2),
          x2: x,
          y2: y + Math.trunc(h / 2) - triSize - 1,
          x3: x,
          y3: y + Math.trunc(h / 2) + triSize + 1
        });
        addLeafShape(add, { type: 'line', name: 'climb pointer mask upper', color: 0, x1: x - triSize - 1, y1: y + Math.trunc(h / 2), x2: x - 2, y2: y + Math.trunc(h / 2) - triSize + 1 });
        addLeafShape(add, { type: 'line', name: 'climb pointer mask lower', color: 0, x1: x - triSize - 1, y1: y + Math.trunc(h / 2), x2: x - 2, y2: y + Math.trunc(h / 2) + triSize - 1 });
      }
      function addLeafWindSockRing(add, x, y, radius, size, showPointer) {
        addLeafShape(add, { type: 'disc', name: 'wind ring fill', x, y, r: radius });
        addLeafShape(add, { type: 'text', name: 'wind logo', color: 0, x: x - 10, y: y + 11, text: '(', font: 'wind_logo' });
        if (showPointer) {
          addLeafShape(add, { type: 'triangle', name: 'heading pointer', x1: x, y1: y - radius - size, x2: x + size - 2, y2: y - radius - 1, x3: x - size + 2, y3: y - radius - 1 });
        }
        const compassRadius = radius + 6;
        addLeafText(add, 'compass N', x - 2, y - compassRadius + 4, 'N', 'leaf_compass', 2);
        addLeafText(add, 'compass E', x + compassRadius - 2, y + 4, 'E', 'leaf_compass', 2);
        addLeafText(add, 'compass S', x - 2, y + compassRadius + 4, 'S', 'leaf_compass', 2);
        addLeafText(add, 'compass W', x - compassRadius - 2, y + 4, 'W', 'leaf_compass', 2);
      }
      function speedX(speed, baseX = 70) {
        const len = String(speed).length;
        return len <= 1 ? baseX + 6 : len >= 3 ? baseX - 6 : baseX;
      }
      function leftPadX(value, baseX, digitCount, step = 4) {
        return baseX + Math.max(0, digitCount - String(value).length) * step;
      }
      function batteryGlyph(percent) {
        return String(clamp(Math.round(Number(percent) / 12.5), 0, 8));
      }
      function addLeafHeader(add, navPage = false, showTurnArrows = false, model = readSimModel()) {
        const headingText = model.gpsFix ? cardinalFromHeading(model.heading) : '--';
        addLeafText(add, 'clock', 0, 10, '12:34', 'leaf_6x10');
        addLeafText(add, 'speed', speedX(model.speed), 14, model.gpsFix ? String(model.speed) : '--', 'leaf_8x14');
        addLeafText(add, 'speed units', 82, 21, 'MPH', 'leaf_5h', navPage ? 0 : 1);
        addLeafText(add, showTurnArrows ? 'heading turn' : 'heading', showTurnArrows ? 37 : headingText.length > 1 ? 41 : 45, 10, showTurnArrows ? `<${headingText}>` : headingText, 'leaf_7x10');
      }
      function addLeafFooter(add, timerSelected = false, model = readSimModel()) {
        addLeafText(add, 'battery icon', 0, 192, batteryGlyph(model.battery), 'Leaf_BattIcon_Vertical');
        addLeafText(add, 'sd icon', 10, 192, '<', 'leaf_icons');
        addLeafText(add, 'fanet icon', 23, 192, 'U', 'leaf_icons');
        addLeafText(add, 'volume icon', 37, 191, 'L', 'leaf_icons');
        if (timerSelected) addLeafShape(add, { type: 'rbox', name: 'timer selected fill', x: 50, y: 178, w: 46, h: 16, r: 2 });
        addLeafText(add, 'timer', 52, 192, model.timerText, 'leaf_6x12', timerSelected ? 0 : 1);
      }
      function addLeafHeaderFooter(add, timerSelected = false, showTurnArrows = false, navPage = false, model = readSimModel()) {
        addLeafHeader(add, navPage, showTurnArrows, model);
        addLeafFooter(add, timerSelected, model);
      }
      function cardinalFromHeading(deg) {
        const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
        return dirs[Math.round((((deg % 360) + 360) % 360) / 45) % 8];
      }
      function addThermalTemplate(add, model = readSimModel()) {
        const climbText = `${model.climbRate >= 0 ? '+' : ''}${model.climbRate} f`;
        addLeafHeaderFooter(add, model.cursor === 'timer', false, false, model);
        addLeafWindSockRing(add, 56, 31, 12, 7, model.gpsFix);
        addLeafVarioBar(add, 'thermal vario bar', 21, 75, 75, 25, model.reuseShapes);
        if (model.cursor === 'altitude') addLeafShape(add, { type: 'rframe', name: 'altitude selected', x: 25, y: 55, w: 66, h: 29, r: 2 });
        addLeafText(add, 'alt label', 77, 57, 'MSL', 'leaf_labels');
        addLeafText(add, 'alt units', 85, 49, 'ft', 'leaf_labels');
        addLeafText(add, 'altitude', leftPadX(model.altitude, 27, 4), 79, String(model.altitude), 'leaf_21h');
        const climbBoxY = 21 + 75 - Math.trunc(27 / 2);
        addLeafClimbPointerBox(add, 25, climbBoxY, 76, 27, 13);
        addLeafText(add, 'climb rate', climbText.length > 6 ? 16 : 20, climbBoxY + 24, climbText, 'leaf_21h', 0);
        if (model.cursor === 'user1') addLeafShape(add, { type: 'rframe', name: 'user field 1 selected', x: 27, y: climbBoxY + 30, w: 67, h: 26, r: 2 });
        addLeafText(add, 'user field 1 label', 29, climbBoxY + 39, 'ABOVE LAUNCH', 'leaf_5h');
        addLeafText(add, 'user field 1 value', 49 - Math.max(0, String(model.aboveLaunch).length - 3) * 3, climbBoxY + 53, String(model.aboveLaunch), 'leaf_6x12');
        if (model.cursor === 'user2') addLeafShape(add, { type: 'rframe', name: 'user field 2 selected', x: 27, y: climbBoxY + 57, w: 67, h: 26, r: 2 });
        addLeafText(add, 'user field 2 label', 29, climbBoxY + 66, '` GLIDE', 'leaf_5h');
        addLeafText(add, 'user field 2 value', 49, climbBoxY + 80, model.glide.toFixed(1), 'leaf_6x12');
      }
      function importTemplate(name) {
        const W = state.display.w, H = state.display.h;
        const sx = W / 96, sy = H / 192;
        const S = (v, axis) => Math.round(v * (axis === 'x' ? sx : sy));
        const scaleShape = s => {
          const out = { ...s };
          ['x', 'x1', 'x2', 'x3'].forEach(k => { if (k in out) out[k] = S(out[k], 'x'); });
          ['y', 'y1', 'y2', 'y3'].forEach(k => { if (k in out) out[k] = S(out[k], 'y'); });
          if ('w' in out) out.w = Math.max(1, S(out.w, 'x'));
          if ('h' in out) out.h = Math.max(1, S(out.h, 'y'));
          if ('r' in out) out.r = Math.max(1, S(out.r, 'x'));
          if ('diameter' in out) out.diameter = Math.max(1, S(out.diameter, 'x'));
          return out;
        };
        const add = s => {
          const out = s.preserveScale ? { ...s } : scaleShape(s);
          delete out.preserveScale;
          out.id = state.nextId++;
          out.visible = true;
          out.color ??= 1;
          state.shapes.push(normalizeShape(out));
        };
        const reuseShapes = new Map(state.shapes.filter(s => s.type === 'varioBar').map(s => [s.name, JSON.parse(JSON.stringify(s))]));
        const model = readSimModel();
        model.reuseShapes = reuseShapes;
        const climbText = `${model.climbRate >= 0 ? '+' : ''}${model.climbRate}`;
        const previousSelection = selected();
        const previousSelectionKey = previousSelection ? `${previousSelection.type}:${previousSelection.name}` : null;
        state.shapes = [];
        state.activeTemplate = name;
        if (name === 'simple') {
          addLeafText(add, 'clock', 0, 10, '12:34', 'leaf_6x10');
          addLeafFooter(add, model.cursor === 'timer', model);
          addLeafText(add, 'speed units', 77, 40, 'MPH', 'leaf_labels');
          addLeafText(add, 'speed', speedX(model.speed, 59), 28, model.gpsFix ? String(model.speed) : '--', 'leaf_21h');
          addLeafText(add, 'heading', 36, 28, model.gpsFix ? cardinalFromHeading(model.heading) : '--', 'leaf_8x14');
          addLeafWindSockRing(add, 48, 54, 17, 8, model.gpsFix);
          addLeafVarioBar(add, 'simple vario bar', 18, 85, 70, 12, reuseShapes);
          const climbBoxY = 18 + 85 - Math.trunc(34 / 2);
          addLeafClimbPointerBox(add, 21, climbBoxY, 75, 34, 16);
          addLeafText(add, 'climb rate', climbText.length > 4 ? 5 : 11, climbBoxY + 31, `${climbText}f`, 'leaf_28h', 0);
          addLeafText(add, 'altitude label', 15, 138, 'MSL Altitude ft', 'leaf_labels');
          addLeafText(add, 'altitude', leftPadX(model.altitude, 13, 4, 6), 167, String(model.altitude), 'leaf_28h');
        }
        if (name === 'thermal' || name === 'thermalAdv') {
          if (name === 'thermal') {
            addThermalTemplate(add, model);
          } else {
            addLeafHeaderFooter(add, model.cursor === 'timer', false, false, model);
            addLeafVarioBar(add, 'thermal advanced vario bar', 30, 70, 70, 20, reuseShapes);
            add({ type: 'frame', name: 'graph box', x: 19, y: 30, w: 77, h: 40 });
            addLeafText(add, 'altitude', leftPadX(model.altitude, 22, 4, 3), 89, String(model.altitude), 'leaf_8x14');
            addLeafClimbPointerBox(add, 20, 92, 76, 17, 6);
            addLeafText(add, 'climb rate', 20, 108, climbText, 'leaf_8x14', 0);
            addLeafText(add, 'above launch', 24, 132, String(model.aboveLaunch), 'leaf_6x12');
            add({ type: 'hline', name: 'user top', x: 19, y: 136, w: 77 });
            add({ type: 'hline', name: 'user mid', x: 19, y: 153, w: 77 });
            add({ type: 'hline', name: 'user bottom', x: 19, y: 170, w: 77 });
            add({ type: 'vline', name: 'user column', x: 58, y: 136, h: 34 });
            addLeafText(add, 'temperature', 25, 152, '72F', 'leaf_6x12');
            addLeafText(add, 'humidity', 61, 152, '45%', 'leaf_6x12');
            addLeafText(add, 'accel', 25, 169, '1.0G', 'leaf_6x12');
            addLeafText(add, 'glide', 61, 169, model.glide.toFixed(1), 'leaf_6x12');
          }
        }
        if (name === 'navigate') {
          const navX = 56, navY = 52, navR = 38, top = 13, barW = 18, topH = 75, botH = 45;
          const barH = topH + botH + 1, mid = top + topH;
          add({ type: 'box', name: 'nav black field', x: barW, y: top, w: 96 - barW, h: navR * 2 + 4 });
          add({ type: 'disc', name: 'nav circle cutout', color: 0, x: navX, y: navY, r: navR });
          add({ type: 'box', name: 'speed notch', color: 0, x: 68, y: top, w: 28, h: 2 });
          add({ type: 'hline', name: 'speed notch lip', color: 0, x: 64, y: top, w: 4 });
          addLeafHeaderFooter(add, model.cursor === 'timer', true, true, model);
          add({ type: 'box', name: 'travel arrow erase', color: 0, x: navX - 2, y: navY - navR - 2, w: 5, h: 4 });
          add({ type: 'line', name: 'travel arrow left', x1: 51, y1: 20, x2: 56, y2: 11 });
          add({ type: 'line', name: 'travel arrow right', x1: 61, y1: 20, x2: 56, y2: 11 });
          add({ type: 'line', name: 'travel arrow left thick', x1: 50, y1: 20, x2: 55, y2: 11 });
          add({ type: 'line', name: 'travel arrow right thick', x1: 62, y1: 20, x2: 57, y2: 11 });
          add({ type: 'vline', name: 'travel arrow shaft left', x: 54, y: 20, h: 6 });
          add({ type: 'vline', name: 'travel arrow shaft right', x: 58, y: 20, h: 6 });
          addLeafWindSockRing(add, navX, navY, 12, 7, false);
          addLeafVarioBar(add, 'navigate vario bar', top, topH, botH, barW, reuseShapes);
          add({ type: 'triangle', name: 'climb side pointer', x1: 8, y1: 88, x2: 17, y2: 79, x3: 17, y3: 97 });
          add({ type: 'line', name: 'climb side pointer mask upper', color: 0, x1: 7, y1: 88, x2: 16, y2: 80 });
          add({ type: 'line', name: 'climb side pointer mask upper 2', color: 0, x1: 7, y1: 87, x2: 16, y2: 79 });
          add({ type: 'line', name: 'climb side pointer mask lower', color: 0, x1: 7, y1: 88, x2: 16, y2: 96 });
          add({ type: 'line', name: 'climb side pointer mask lower 2', color: 0, x1: 7, y1: 89, x2: 16, y2: 97 });
          add({ type: 'box', name: 'climb background', x: barW, y: top + 2 * navR + 4, w: 30, h: 17 });
          addLeafText(add, 'climb sign', barW - 6, mid + 6, model.climbRate >= 0 ? '+' : '-', 'leaf_8x14', 0);
          addLeafText(add, 'climb value', barW + 1, mid + 20, String(Math.abs(model.climbRate)), 'leaf_8x14', 0);
          addLeafText(add, 'altitude', leftPadX(model.altitude, 49, 4, 3), 109, String(model.altitude), 'leaf_8x14', 0);
          addLeafText(add, 'alt label', 78, top + 2 * navR + 5, 'MSL', 'leaf_labels', 0);
          addLeafText(add, 'alt units', 86, top + 2 * navR - 3, 'ft', 'leaf_labels', 0);
          addLeafText(add, 'waypoint', barW + 2, top + barH - 9, '<Select Dest>', 'leaf_6x12');
          add({ type: 'frame', name: 'progress frame', x: barW - 1, y: top + barH - 4, w: 96 - barW + 1, h: 4 });
          add({ type: 'box', name: 'progress fill', x: barW, y: top + barH - 3, w: 31, h: 2 });
          addLeafText(add, 'time label', 3, top + barH + 7, 'TIME>&', 'leaf_5h');
          addLeafText(add, 'time remaining', 8, top + barH + 20, model.timerText, 'leaf_6x12');
          addLeafText(add, 'dist label', 52, top + barH + 7, 'DIST>&', 'leaf_5h');
          addLeafText(add, 'distance', 57, top + barH + 20, '3.2MI', 'leaf_6x12');
          addLeafText(add, 'glide label', 3, top + barH + 27, '`GLIDE', 'leaf_5h');
          addLeafText(add, 'glide', 8, top + barH + 40, model.glide.toFixed(1), 'leaf_6x12');
          addLeafText(add, 'glide waypoint label', 52, top + barH + 27, '`>&', 'leaf_5h');
          addLeafText(add, 'glide waypoint', 57, top + barH + 40, (model.glide - 0.5).toFixed(1), 'leaf_6x12');
        }
        if (name === 'menu') {
          add({ type: 'hline', name: 'menu title bottom', x: 0, y: 15, w: 96 });
          add({ type: 'text', name: 'title', x: 8, y: 12, text: 'MENU', font: 'leaf_8x14' });
          ['FLIGHT', 'GPS', 'DISPLAY', 'SYSTEM', 'WIFI'].forEach((t, i) => add({ type: 'text', name: 'menu ' + t, x: 8, y: 38 + i * 25, text: t, font: 'leaf_8x14' }));
          add({ type: 'rframe', name: 'selection', x: 2, y: 21, w: 92, h: 24, r: 3 });
          add({ type: 'hline', name: 'footer', x: 0, y: 174, w: 96 });
        }
        if (name === 'debug') {
          add({ type: 'text', name: 'speed label', x: 0, y: 7, text: 'mph', font: 'leaf_5x8' });
          add({ type: 'text', name: 'speed', x: 0, y: 17, text: model.gpsFix ? String(model.speed) : '--', font: 'leaf_8x14' });
          add({ type: 'text', name: 'heading label', x: 0, y: 27, text: 'Heading', font: 'leaf_5x8' });
          add({ type: 'text', name: 'heading', x: 0, y: 37, text: model.gpsFix ? String(model.heading) : '--', font: 'leaf_8x14' });
          add({ type: 'text', name: 'alt label', x: 0, y: 47, text: 'alt', font: 'leaf_5x8' });
          add({ type: 'text', name: 'altitude', x: 0, y: 60, text: String(model.altitude), font: 'leaf_8x14' });
          add({ type: 'text', name: 'climb rate', x: 0, y: 75, text: climbText, font: 'leaf_8x14' });
          add({ type: 'disc', name: 'pie center', x: 48, y: 110, r: 28 });
          add({ type: 'hline', name: 'pie hline', x: 20, y: 110, w: 56, color: 0 });
          add({ type: 'vline', name: 'pie vline', x: 48, y: 82, h: 56, color: 0 });
          add({ type: 'circle', name: 'estimate circle', x: 48, y: 110, r: 35 });
        }
        const restoredSelection = previousSelectionKey
          ? state.shapes.find(s => `${s.type}:${s.name}` === previousSelectionKey)
          : null;
        state.selectedId = restoredSelection?.id || state.shapes[0]?.id || null;
        render();
      }

      nameInput.addEventListener('input', () => { const s = selected(); if (s) { s.name = nameInput.value; render(); } });
      colorInput.addEventListener('change', () => { const s = selected(); if (s) { s.color = Number(colorInput.value); render(); } });
      fontInput.addEventListener('change', () => { const s = selected(); if (s) { s.font = fontInput.value; render(); } });
      textInput.addEventListener('input', () => { const s = selected(); if (s) { s.text = textInput.value; render(); } });
      root.querySelector('#lde-backward').addEventListener('click', () => layer(-1));
      root.querySelector('#lde-forward').addEventListener('click', () => layer(1));
      root.querySelector('#lde-duplicate').addEventListener('click', duplicate);
      root.querySelector('#lde-delete').addEventListener('click', removeSelected);
      root.querySelector('#lde-grid').addEventListener('click', () => { state.showGrid = !state.showGrid; render(); });
      root.querySelector('#lde-clear').addEventListener('click', () => { state.shapes = []; state.selectedId = null; state.activeTemplate = null; render(); });
      root.querySelector('#lde-import-btn').addEventListener('click', () => {
        const val = root.querySelector('#lde-import').value;
        if (val) importTemplate(val);
      });
      profileSelect.addEventListener('change', () => {
        state.display = { ...profileMap[profileSelect.value] };
        if (state.activeTemplate) importTemplate(state.activeTemplate);
        else render();
      });
      zoomInput.addEventListener('input', () => { state.zoom = Number(zoomInput.value); zoomValue.textContent = state.zoom + 'x'; render(); });
      root.querySelectorAll('[data-export]').forEach(btn => btn.addEventListener('click', () => {
        state.exportMode = btn.dataset.export;
        root.querySelectorAll('[data-export]').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
        renderExport();
      }));
      root.querySelector('#lde-refresh-export').addEventListener('click', renderExport);
      loadJsonButton.addEventListener('click', loadLayoutJson);
      root.querySelector('#lde-copy').addEventListener('click', async () => {
        if (state.exportMode === 'png') {
          downloadPng();
          return;
        }
        exportEl.select();
        try { await navigator.clipboard.writeText(exportEl.value); statusEl.textContent = 'Export copied'; }
        catch { document.execCommand('copy'); statusEl.textContent = 'Export copied'; }
      });
      pngBorderInput.addEventListener('change', () => {
        state.pngBorder = pngBorderInput.checked;
        renderExport();
      });
      Object.values(simInputs).forEach(input => {
        input.addEventListener('input', () => {
          updateSimLabels();
          applyLiveValuesToShapes();
          render();
        });
        input.addEventListener('change', () => {
          updateSimLabels();
          applyLiveValuesToShapes();
          render();
        });
      });
      canvas.addEventListener('pointerdown', ev => {
        const p = canvasPoint(ev);
        const s = hitTest(p);
        if (s) {
          state.selectedId = s.id;
          state.drag = { shape: s, start: p, orig: JSON.parse(JSON.stringify(s)) };
          canvas.setPointerCapture(ev.pointerId);
        } else {
          state.selectedId = null;
        }
        render();
      });
      canvas.addEventListener('pointermove', ev => {
        const p = canvasPoint(ev);
        if (state.drag) updateDrag(p);
        else statusEl.textContent = `${p.x}, ${p.y}`;
      });
      canvas.addEventListener('pointerup', ev => {
        if (state.drag) {
          state.drag = null;
          try { canvas.releasePointerCapture(ev.pointerId); } catch {}
          render();
        }
      });
      document.addEventListener('keydown', ev => {
        if (!root.contains(ev.target) && ev.target !== document.body) return;
        const tag = ev.target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        const s = selected();
        if (!s) return;
        const step = ev.shiftKey ? 10 : 1;
        if ((ev.ctrlKey || ev.altKey) && ev.key.startsWith('Arrow')) {
          if (resizeShape(s, ev.key, step)) {
            ev.preventDefault();
            render();
          }
          return;
        }
        if (ev.key === 'ArrowLeft') { moveShape(s, -step, 0); ev.preventDefault(); render(); }
        if (ev.key === 'ArrowRight') { moveShape(s, step, 0); ev.preventDefault(); render(); }
        if (ev.key === 'ArrowUp') { moveShape(s, 0, -step); ev.preventDefault(); render(); }
        if (ev.key === 'ArrowDown') { moveShape(s, 0, step); ev.preventDefault(); render(); }
        if (ev.key === 'Delete' || ev.key === 'Backspace') { removeSelected(); ev.preventDefault(); }
      });

      renderTools();
      updateSimLabels();
      importTemplate('simple');
    })();
  </script>
</div>
</body>
